<text x="110" y="190" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">Optional</text>
<text x="110" y="206" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">external</text>
<text x="110" y="222" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">reset button</text>
<text x="110" y="238" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">(on the box)</text>
<rect x="700" y="190" width="150" height="95" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/>
<text x="775" y="212" font-size="13" text-anchor="middle" fill="#a04000" font-weight="bold">Screw terminals</text>
<text x="775" y="232" font-size="13" text-anchor="middle" fill="#444" font-weight="normal">COM / NO / NC</text>
<text x="775" y="252" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">go to the mains side</text>
<text x="775" y="270" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">(see Diagram B)</text>
<text x="730" y="470" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">JD-VCC jumper: leave it in place</text>
<text x="730" y="486" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">for a bench test</text>
<text x="60" y="640" font-size="13" text-anchor="start" fill="#444" font-weight="normal">• All grounds are joined: ESP32 GND, relay board GND and the supply minus.</text>
<text x="60" y="658" font-size="13" text-anchor="start" fill="#444" font-weight="normal">• No mains is connected in this diagram. Test that every relay clicks from the app first.</text>
<text x="60" y="676" font-size="13" text-anchor="start" fill="#444" font-weight="normal">• Pins for the 2- and 8-relay builds are in docs/03-wiring.md. Active-low board? Set RELAY_ON_LEVEL to 0.</text>
</svg>